# MAMESTer — mame4all configuration.
#
# Read from the CURRENT DIRECTORY at startup (src/rpi/config.cpp
# open_config_file). MAME chdir()s to its own binary's directory first
# (src/rpi/rpi.cpp: realpath(argv[0]) + chdir), so that directory is
# /media/fat/games/mame and every relative path below resolves inside it. Only
# the options mame4all actually parses are honoured — not full MAME's .ini.
#
# deploy.py installs this file only when it is missing, so local edits survive a
# redeploy (use --force-cfg to overwrite).

[config]
artwork=yes
samples=yes
antialias=yes
translucency=yes
skiplines=0
skipcolumns=0
beam=1.0
flicker=0.0
gamma=1.0
frameskip=auto
ror=no
rol=no
flipx=no
flipy=no
# 44100 is what Stage 6 validated end to end: MiSTer's ALSA chain resamples to
# its fixed 48 kHz stereo dummy card, and our explicit hw_params period is
# samplerate/refresh frames (735 at 60 Hz). Changing this changes the period.
samplerate=44100
volume=0
cheat=no
vector_width=640
vector_height=480
kioskmode=no
force_stereo=no

# The display_* options belong to mame4all's own Raspberry Pi scaler, which this
# port replaced: frames go straight to the DDR framebuffer at the driver's native
# resolution and MiSTer's ascal/video_freak does the scaling and shading. They
# are left at their defaults because they no longer reach anything.
display_smooth_stretch=yes
display_border=0
display_integer=1
display_effect=0

[directory]
inp=inp
nvram=nvram
hi=hi
cfg=cfg
snap=snap
memcard=memcard
sta=sta
artwork=artwork
cheat=.
# The manager passes -rompath explicitly (the directory of the romset picked in
# the OSD), which overrides this. It matters only for a hand-run launch.
rompath=roms
samplepath=samples
